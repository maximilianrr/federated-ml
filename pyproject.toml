[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "federated-ml"
version = "1.1.13"
description = "Federated Learning with PyTorch and Flower"
license = {file = "LICENSE"}
requires-python = ">=3.11"
dependencies = [
    "flwr[simulation]>=1.36.0",
    "torch==2.10.0",
    "numpy",
    "pandas",
    "Pillow",
    "scikit-learn",
]

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.flwr.app]
publisher = "flwrlabs"
fab-format-version = 1
flwr-version-target = "1.36.0"

[tool.flwr.app.components]
serverapp = "src.flwr.server_app:app"
clientapp = "src.flwr.client_app:app"

[tool.flwr.app.config]
num-server-rounds = 20
local-epochs = 1
learning-rate = 0.001
batch-size = 32
cache-dir = "data_cache"
output-dir = "outputs"
seed = 42
