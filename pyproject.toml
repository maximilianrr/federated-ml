[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "federated-ml"
version = "1.1.13"
description = "Federated Learning with PyTorch and Flower"
license = {file = "LICENSE"}
dependencies = [
    "flwr[simulation]>=1.36.0",
    "flwr-datasets[vision]>=0.6.1",
    "torch==2.10.0",
    "torchvision==0.25.0",
]

[tool.hatch.build.targets.wheel]
packages = ["."]

[tool.flwr.app]
publisher = "flwrlabs"
fab-format-version = 1
flwr-version-target = "1.36.0"

[tool.flwr.app.components]
serverapp = "src.flwr.server_app:app"
clientapp = "src.flwr.client_app:app"

[tool.flwr.app.config]
num-server-rounds = 3
fraction-evaluate = 1.0
local-epochs = 4
learning-rate = 0.1
batch-size = 32
save-model = false